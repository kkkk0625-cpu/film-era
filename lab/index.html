  <!-- 上传作品弹窗 -->
  <div class="upload-modal" id="uploadModal">
    <div class="upload-modal-content">
      <span class="upload-modal-close" id="uploadModalClose">&times;</span>

      <!-- 顶部标签页 -->

        <button class="upload-tab" data-tab="image">上传图文</button>
        <button class="upload-tab" data-tab="article">写长文</button>
        <div class="upload-draft">
          <svg class="draft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>草稿箱(0)</span>
        </div>
      </div>

      <!-- 上传区域 -->
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <p class="upload-hint">拖拽视频到此或点击上传</p>
        <button class="upload-btn">上传视频</button>
        <input type="file" id="fileInput" accept="video/*,image/*" hidden>
      </div>

      <!-- 底部信息 -->
      <div class="upload-info">
        <div class="upload-info-item">
          <h4>视频大小</h4>
          <p>支持时长4小时以内，<br>最大20GB的视频文件</p>
        </div>
        <div class="upload-info-item">
          <h4>视频格式</h4>
          <p>支持常用视频格式，<br>推荐使用mp4、mov</p>
        </div>
        <div class="upload-info-item">
          <h4>视频分辨率</h4>
          <p>超过1080P的视频用网页端上传画质更清晰</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 上传弹窗功能
    document.addEventListener('DOMContentLoaded', function() {
      const uploadModal = document.getElementById('uploadModal');
      const uploadModalClose = document.getElementById('uploadModalClose');
      const uploadWorkBtn = document.querySelector('.icon-link');
      const uploadTabs = document.querySelectorAll('.upload-tab');
      const uploadArea = document.getElementById('uploadArea');
      const fileInput = document.getElementById('fileInput');

      // 打开弹窗
      if (uploadWorkBtn) {
        uploadWorkBtn.addEventListener('click', function(e) {
          e.preventDefault();
          uploadModal.style.display = 'flex';
        });
      }

      // 关闭弹窗
      uploadModalClose.addEventListener('click', function() {
        uploadModal.style.display = 'none';
      });

      // 点击背景关闭
      uploadModal.addEventListener('click', function(e) {
        if (e.target === uploadModal) {
          uploadModal.style.display = 'none';
        }
      });

      // ESC键关闭
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && uploadModal.style.display === 'flex') {
          uploadModal.style.display = 'none';
        }
      });

      // 标签页切换
      uploadTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          uploadTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');

          // 根据标签更新上传区域内容
          const tabType = this.dataset.tab;
          updateUploadArea(tabType);
        });
      });

      // 更新上传区域
      function updateUploadArea(type) {
        const uploadHint = uploadArea.querySelector('.upload-hint');
        const uploadBtn = uploadArea.querySelector('.upload-btn');

        if (type === 'video') {
          uploadHint.textContent = '拖拽视频到此或点击上传';
          uploadBtn.textContent = '上传视频';
          fileInput.accept = 'video/*';
        } else if (type === 'image') {
          uploadHint.textContent = '拖拽图片到此或点击上传';
          uploadBtn.textContent = '上传图片';
          fileInput.accept = 'image/*';
        } else if (type === 'article') {
          uploadHint.textContent = '点击开始撰写长文';
          uploadBtn.textContent = '开始写作';
        }
      }

      // 点击上传按钮触发文件选择
      const uploadBtn = uploadArea.querySelector('.upload-btn');
      uploadBtn.addEventListener('click', function() {
        const activeTab = document.querySelector('.upload-tab.active');
        if (activeTab.dataset.tab !== 'article') {
          fileInput.click();
        } else {
          alert('长文编辑功能开发中...');
        }
      });

      // 文件选择处理
      fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
          alert('已选择文件: ' + e.target.files[0].name);
        }
      });

      // 拖拽上传
      uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.style.backgroundColor = '#e8e8e8';
      });

      uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.style.backgroundColor = '#f5f5f5';
      });

      uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.style.backgroundColor = '#f5f5f5';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          alert('已拖拽文件: ' + files[0].name);
        }
      });
    });
  </script>
